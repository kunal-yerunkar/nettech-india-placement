version: '3.8'
services:
  mongo:
    image: mongo:6
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db
  backend:
    build: ./backend
    command: npm run dev
    volumes:
      - ./backend:/app
    environment:
      - MONGO_URI=mongodb://mongo:27017/nettech
    ports:
      - 5000:5000
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - 5173:5173
    depends_on:
      - backend
volumes:
  mongo_data: {}
